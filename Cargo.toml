[workspace]
resolver = "2"
members = [
    "crates/ccda-model",
    "crates/ccda-terminology",
    "crates/ccda-map",
    "crates/fhir-out",
    "crates/ccda2fhir",
    "crates/ccda2fhir-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alvinhenrick/ccda2fhir"
homepage = "https://github.com/alvinhenrick/ccda2fhir"
rust-version = "1.85"
keywords = ["fhir", "ccda", "hl7", "healthcare", "converter"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

# Internal crates
ccda-model = { path = "crates/ccda-model", version = "0.1.0" }
ccda-terminology = { path = "crates/ccda-terminology", version = "0.1.0" }
ccda-map = { path = "crates/ccda-map", version = "0.1.0" }
fhir-out = { path = "crates/fhir-out", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
