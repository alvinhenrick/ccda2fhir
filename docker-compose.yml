services:
  ccda2fhir:
    build: .
    image: ccda2fhir:latest
    ports:
      - "8080:8080"
    environment:
      MAX_BODY_BYTES: "10485760"   # 10 MiB
      MAX_CONCURRENCY: "64"
      REQUEST_TIMEOUT_SECS: "30"
      RUST_LOG: "info"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
