name: FHIR validation

# Converts every fixture and validates the output with the official HL7 FHIR validator
# against FHIR R4 (4.0.1) and US Core. See scripts/validate.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: HL7 validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache validator and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            .cache/validator
            ~/.fhir/packages
          key: fhir-validator-${{ hashFiles('scripts/validate.sh') }}
          restore-keys: fhir-validator-
      - name: Convert fixtures and validate
        run: scripts/validate.sh
      - name: Summarize results
        if: always()
        run: |
          {
            echo "## FHIR validation"
            for f in target/validation/*.validation.txt; do
              [ -e "$f" ] || continue
              echo "### $(basename "$f" .validation.txt)"
              echo '```'
              grep -E "^(Success|\*FAILURE\*|Error @|Warning @|Information @)|errors?, .* warnings?" "$f" | head -60 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate validator findings
        if: always()
        run: |
          # Fixtures are synthetic, so findings are safe to show. Annotations are capped at 10 per level.
          for level in Error Warning; do
            cat target/validation/*.validation.txt 2>/dev/null \
              | grep -E "^\s*$level @" | grep -v "dom-6" | sed -E 's/^\s+//; s/%/%25/g' | sort -u | head -10 \
              | while IFS= read -r line; do echo "::${level,,}::${line:0:480}"; done
          done
          grep -hE "^(Success|\*FAILURE\*)|Unable to|Error fetching" target/validation/*.validation.txt 2>/dev/null | head -30 \
            | while IFS= read -r line; do echo "::notice::${line:0:300}"; done
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: target/validation/

  corpus:
    # Public HL7 C-CDA example documents (not our fixtures): a regression net against real-shaped
    # input. Not a required check; a failure here means a document the converter turns into
    # invalid FHIR, which we want to know about.
    name: HL7 example corpus
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache validator and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            .cache/validator
            ~/.fhir/packages
          key: fhir-validator-${{ hashFiles('scripts/validate.sh') }}
          restore-keys: fhir-validator-
      - name: Collect the full documents from HL7/C-CDA-Examples
        run: |
          git clone -q --depth 1 https://github.com/HL7/C-CDA-Examples.git "$RUNNER_TEMP/examples"
          mkdir -p "$RUNNER_TEMP/corpus"
          n=0
          while IFS= read -r -d '' f; do
            # Only well-formed ClinicalDocuments in the HL7 namespace; the repo also holds stubs and fragments.
            if grep -Pzq '<ClinicalDocument[^>]*xmlns="urn:hl7-org:v3"' "$f" && python3 -c 'import sys, xml.etree.ElementTree as E; E.parse(sys.argv[1])' "$f" 2>/dev/null; then
              n=$((n+1)); cp "$f" "$RUNNER_TEMP/corpus/doc$n.xml"
            fi
          done < <(find "$RUNNER_TEMP/examples" -name '*.xml' -print0 | sort -z)
          echo "collected $n documents"
          cargo build -q -p ccda2fhir --example convert_file
          for f in "$RUNNER_TEMP"/corpus/*.xml; do
            if ! target/debug/examples/convert_file "$f" /dev/null 2>"$RUNNER_TEMP/err.txt"; then
              echo "::error::$(basename "$f") from ${f}: $(grep -m1 'conversion failed' "$RUNNER_TEMP/err.txt")"
            fi
          done
      - name: Convert and validate
        run: FIXTURE_DIR="$RUNNER_TEMP/corpus" VALIDATION_OUT="$PWD/target/corpus-validation" scripts/validate.sh
      - name: Summarize results
        if: always()
        run: |
          {
            echo "## HL7 example corpus"
            for f in target/corpus-validation/*.validation.txt; do
              [ -e "$f" ] || continue
              echo "### $(basename "$f" .validation.txt)"
              echo '```'
              grep -E "^(Success|\*FAILURE\*|Error @)|errors?, .* warnings?" "$f" | head -30 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate validator findings
        if: always()
        run: |
          # HL7's public examples, so showing the findings is safe. One annotation lists every
          # distinct error once, with the number of documents it occurs in.
          python3 - <<'PY' > "$RUNNER_TEMP/distinct.md"
          import glob, re, collections
          seen = collections.defaultdict(set)
          for f in sorted(glob.glob("target/corpus-validation/*.validation.txt")):
              doc = f.split("/")[-1].split(".")[0]
              for line in open(f, errors="replace"):
                  m = re.match(r"\s*Error @ (.*)", line)
                  if not m or "dom-6" in line:
                      continue
                  t = re.sub(r"\[\d+\]", "[]", m.group(1))
                  t = re.sub(r"urn:uuid:[0-9a-f-]+", "urn:uuid:X", t)
                  t = re.sub(r"\(line \d+, col\d+\)", "", t)
                  t = re.sub(r"/\*([A-Za-z]+)/[a-z0-9-]+\*/", r"/*\1*/", t)
                  seen[t].add(doc)
          print("## Distinct validator errors in the HL7 example corpus")
          for t, docs in sorted(seen.items(), key=lambda kv: -len(kv[1])):
              print(f"- ({len(docs)} docs: {', '.join(sorted(docs))}) `{t[:380]}`")
          PY
          cat "$RUNNER_TEMP/distinct.md" >> "$GITHUB_STEP_SUMMARY"
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$RUNNER_TEMP/distinct.md")
          echo "::error title=Distinct corpus errors::${msg:0:30000}"
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-validation
          path: target/corpus-validation/
