name: Release-plz

# On every push to main:
#   release     publishes any crate version that is not on crates.io yet, then tags and creates the
#               GitHub release. In practice that happens when a release pull request is merged.
#   release-pr  opens or updates the release pull request (version bump and changelog).
#
# One-time setup: the CARGO_REGISTRY_TOKEN secret, and Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'alvinhenrick' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      # Run the CLI directly (the same tool the action wraps) so a failure can be read from the
      # check annotations without downloading the job log.
      - name: Publish unreleased versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          release-plz release --git-token "$GITHUB_TOKEN" > release.log 2>&1
          code=$?
          sed -E 's/(token|Token|TOKEN)[=: ]+[A-Za-z0-9_-]{12,}/\1=***/g' release.log
          if [ $code -ne 0 ]; then
            echo "::error title=release-plz release::$(tail -n 25 release.log | sed -E 's/(token|Token|TOKEN)[=: ]+[A-Za-z0-9_-]{12,}/\1=***/g' | tr '\n' '|' | cut -c1-3000)"
          fi
          exit $code

  release-pr:
    name: release pull request
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'alvinhenrick' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
