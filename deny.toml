[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense", "BSD-3-Clause",
    # TLS stack for fetching the JWKS (ring, rustls-webpki, untrusted) and the root store data.
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
